name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  # ==========================================================================
  # Pre-deployment Checks
  # ==========================================================================
  pre-deploy:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose files
        run: |
          docker-compose -f docker-compose.yml config > /dev/null
          docker-compose -f docker-compose.prod.yml config > /dev/null
          echo "✅ Docker Compose files are valid"

      - name: Check for .env.example
        run: |
          if [ ! -f backend/.env.example ]; then
            echo "❌ .env.example not found"
            exit 1
          fi
          echo "✅ .env.example exists"

      - name: Security check
        run: |
          # Ensure no .env files are committed
          if git ls-files | grep -q "\.env$"; then
            echo "❌ .env file found in repository!"
            exit 1
          fi
          echo "✅ No .env files in repository"

  # ==========================================================================
  # Build and Push Docker Images
  # ==========================================================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: pre-deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/spv-treasure-map
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Deploy to Production
  # ==========================================================================
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://spvtreasurehunt.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER }} >> ~/.ssh/known_hosts

      - name: Deploy to production server
        env:
          SERVER: ${{ secrets.PRODUCTION_SERVER }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh ${USER}@${SERVER} << 'ENDSSH'
            set -e
            cd /opt/spv-treasure-map

            # Pull latest code
            git fetch origin
            git checkout main
            git pull origin main

            # Run deployment script
            bash scripts/production/deploy.sh

            # Check health
            sleep 30
            bash scripts/production/health_check.sh
          ENDSSH

      - name: Verify deployment
        run: |
          # Wait for service to be ready
          for i in {1..30}; do
            if curl -f -s https://spvtreasurehunt.com/api/health > /dev/null; then
              echo "✅ Deployment successful!"
              exit 0
            fi
            echo "Waiting for service to be ready... ($i/30)"
            sleep 10
          done
          echo "❌ Deployment verification failed"
          exit 1

  # ==========================================================================
  # Post-deployment Tasks
  # ==========================================================================
  post-deploy:
    name: Post-deployment Tasks
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Send deployment notification
        if: success()
        run: |
          # Add notification logic here (Slack, Discord, email, etc.)
          echo "✅ Deployment successful - Commit: ${{ github.sha }}"
          echo "🚀 Deployed by: ${{ github.actor }}"

      - name: Send failure notification
        if: failure()
        run: |
          # Add failure notification logic here
          echo "❌ Deployment failed - Commit: ${{ github.sha }}"
          echo "👤 Attempted by: ${{ github.actor }}"

      - name: Create deployment record
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'Automated deployment from GitHub Actions',
              auto_merge: false,
              required_contexts: []
            });

  # ==========================================================================
  # Rollback (Manual Trigger Only)
  # ==========================================================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'workflow_dispatch'
    needs: deploy

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Execute rollback
        env:
          SERVER: ${{ secrets.PRODUCTION_SERVER }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh ${USER}@${SERVER} << 'ENDSSH'
            set -e
            cd /opt/spv-treasure-map

            # Run rollback script
            bash scripts/production/rollback.sh
          ENDSSH

      - name: Notify rollback
        run: |
          echo "⚠️ Rollback executed for commit: ${{ github.sha }}"
